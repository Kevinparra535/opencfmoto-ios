# XcodeGen spec — generate the Xcode project with:  brew install xcodegen && xcodegen generate
name: OpenCfMoto
options:
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: en
  createIntermediateGroups: true
  groupSortPosition: top
configFiles:
  Debug: Config/OpenCfMoto.xcconfig
  Release: Config/OpenCfMoto.xcconfig
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    TARGETED_DEVICE_FAMILY: "1"
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    SWIFT_EMIT_LOC_STRINGS: YES
packages:
  OpenCfMotoKit:
    path: Packages/OpenCfMotoKit
targets:
  OpenCfMoto:
    type: application
    platform: iOS
    sources:
      - path: App/Sources
      - path: App/Resources
        excludes:
          - "Localization/**"
    dependencies:
      - package: OpenCfMotoKit
        product: OpenCfMotoCore
      - package: OpenCfMotoKit
        product: OpenCfMotoApple
      - package: OpenCfMotoKit
        product: OpenCfMotoAppModel
      - target: OpenCfMotoMirror
        embed: true
        codeSign: true
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: OpenCfMoto
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleDevelopmentRegion: en
        CFBundleLocalizations: [en, es]
        LSRequiresIPhoneOS: true
        UILaunchScreen: {}
        UIApplicationSupportsIndirectInputEvents: true
        UIRequiredDeviceCapabilities: [arm64]
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIBackgroundModes: [location, audio]
        ITSAppUsesNonExemptEncryption: false
        # Purpose strings: keep in sync with App/Resources/{en,es}.lproj/InfoPlist.strings (localized).
        NSCameraUsageDescription: "OpenCfMoto uses the camera to scan the pairing QR code shown on your bike's dash."
        NSLocationWhenInUseUsageDescription: "OpenCfMoto uses your location, also while your iPhone is locked during a ride, to show the map and turn-by-turn guidance on your bike's dash and to log your rides on this iPhone. To find places, routes and speed limits, it sends your searches and positions to OpenStreetMap-based online services."
        UIRequiresPersistentWiFi: true
        NSLocalNetworkUsageDescription: "OpenCfMoto talks to your motorcycle's dashboard over its Wi-Fi to show the map on the dash."
        NSBonjourServices: [_EasyConn._tcp]
        OCMAppGroupIdentifier: $(APP_GROUP_ID)
        CFBundleDocumentTypes:
          - CFBundleTypeName: GPX track
            LSHandlerRank: Alternate
            LSItemContentTypes: [com.topografix.gpx]
        UTImportedTypeDeclarations:
          - UTTypeIdentifier: com.topografix.gpx
            UTTypeDescription: GPX track
            UTTypeConformsTo: [public.xml]
            UTTypeTagSpecification:
              public.filename-extension: [gpx]
              public.mime-type: [application/gpx+xml]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_ID_PREFIX).opencfmoto
        PRODUCT_NAME: OpenCfMoto
        CODE_SIGN_ENTITLEMENTS: App/Entitlements/$(OCM_FLAVOR).entitlements
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: $(inherited) $(OCM_SWIFT_FLAGS_$(OCM_FLAVOR))
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        DEVELOPMENT_TEAM: $(DEVELOPMENT_TEAM)
  OpenCfMotoMirror:
    type: app-extension
    platform: iOS
    sources:
      - path: MirrorExtension
    dependencies:
      - package: OpenCfMotoKit
        product: OpenCfMotoCore
      - package: OpenCfMotoKit
        product: OpenCfMotoApple
      - sdk: ReplayKit.framework
    info:
      path: MirrorExtension/Info.plist
      properties:
        CFBundleDisplayName: OpenCfMoto Mirror
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        OCMAppGroupIdentifier: $(APP_GROUP_ID)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.broadcast-services-upload
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).SampleHandler
          RPBroadcastProcessMode: RPBroadcastProcessModeSampleBuffer
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_ID_PREFIX).opencfmoto.mirror
        PRODUCT_NAME: OpenCfMotoMirror
        CODE_SIGN_ENTITLEMENTS: MirrorExtension/OpenCfMotoMirror.entitlements
        DEVELOPMENT_TEAM: $(DEVELOPMENT_TEAM)
        APPLICATION_EXTENSION_API_ONLY: YES
schemes:
  OpenCfMoto:
    build:
      targets:
        OpenCfMoto: all
        OpenCfMotoMirror: all
    run:
      config: Debug
    archive:
      config: Release
