# SPDX-License-Identifier: AGPL-3.0-or-later
# TestFlight: build, sign and upload the app from GitHub Actions with nothing but an App Store
# Connect API key (no Mac needed). Run it by hand: Actions ▸ TestFlight ▸ Run workflow.
# Owner guide (Spanish): docs/TESTFLIGHT.md
#
#   prepare (Linux)  check the key; register the bundle ids and capabilities; find the App Store
#                    Connect app; remove what an earlier run left behind  (tools/testflight/asc.py)
#   build (macOS)    choose the build number; temporary distribution certificate + profiles,
#                    keychain, archive, lint, export, upload  (tools/testflight/build_and_sign.sh)
#   finish (Linux)   once a build reached Apple: wait for Apple's processing, put the build in an
#                    internal TestFlight group, then revoke the temporary certificate and profiles.
#                    It also runs after a failed build job, to revoke what that job could not.
#
# This repository is public, so its logs are too: secrets reach only the steps that need them, in
# the environment; nothing secret is printed; the IPA / archive are never uploaded as artifacts.
# Actions are pinned to commit SHAs: these jobs hold an Admin App Store Connect key.
name: TestFlight

on:
  workflow_dispatch:
    inputs:
      setup_only:
        description: "Solo preparar: registra los identificadores y muestra los pasos que faltan; no compila"
        type: boolean
        default: false

permissions:
  contents: read

# One TestFlight run at a time in this repository (a concurrency group never spans repositories).
# The leftover sweep (asc.py janitor) relies on it for this repository's «OpenCfMoto CI r<repository
# id>-…» profiles only; those of other repositories or of a Mac run go only once older than 12 hours.
concurrency:
  group: testflight
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  prepare:
    name: Prepare (App Store Connect)
    # The App Store Connect key lives in the protected environment "testflight" (docs/TESTFLIGHT.md,
    # "Proteger la clave"): only runs from main get it. Without that environment GitHub creates an
    # unprotected one and the repository secrets keep working.
    environment: testflight
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      ready: ${{ steps.prepare.outputs.ready }}
      prefix: ${{ steps.prefix.outputs.prefix }}
      team_id: ${{ steps.prepare.outputs.team_id }}
      app_bundle_id: ${{ steps.prepare.outputs.app_bundle_id }}
      mirror_bundle_id: ${{ steps.prepare.outputs.mirror_bundle_id }}
      app_bundle_resource_id: ${{ steps.prepare.outputs.app_bundle_resource_id }}
      mirror_bundle_resource_id: ${{ steps.prepare.outputs.mirror_bundle_resource_id }}
      app_group: ${{ steps.prepare.outputs.app_group }}
      app_id: ${{ steps.prepare.outputs.app_id }}
      marketing_version: ${{ steps.prepare.outputs.marketing_version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check that the API key secrets exist
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
        run: |
          missing=""
          if [ -z "$ASC_KEY_ID" ]; then missing="$missing ASC_KEY_ID"; fi
          if [ -z "$ASC_ISSUER_ID" ]; then missing="$missing ASC_ISSUER_ID"; fi
          if [ -z "$ASC_PRIVATE_KEY" ]; then missing="$missing ASC_PRIVATE_KEY"; fi
          if [ -n "$missing" ]; then
            guide="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/blob/main/docs/TESTFLIGHT.md"
            echo "::error title=Faltan secretos / Missing secrets::Faltan los secretos del repositorio:$missing. Créalos en Settings ▸ Secrets and variables ▸ Actions ▸ New repository secret y lanza una ejecución nueva: Actions ▸ TestFlight ▸ Run workflow (guía: $guide).%0AMissing repository secrets:$missing. Add them under Settings ▸ Secrets and variables ▸ Actions ▸ New repository secret, then start a new run: Actions ▸ TestFlight ▸ Run workflow (guide: $guide)."
            {
              echo "## TestFlight: faltan secretos / missing secrets"
              echo
              echo "Faltan:$missing. Créalos en **Settings ▸ Secrets and variables ▸ Actions** con los datos de tu clave de API de App Store Connect y lanza una ejecución nueva: **Actions ▸ TestFlight ▸ Run workflow**. Guía: $guide"
              echo
              echo "Missing:$missing. Add them under **Settings ▸ Secrets and variables ▸ Actions** from your App Store Connect API key, then start a new run: **Actions ▸ TestFlight ▸ Run workflow**. Guide: $guide"
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          echo "The three API key secrets are set."

      - name: Bundle id prefix
        id: prefix
        env:
          PREFIX_VARIABLE: ${{ vars.BUNDLE_ID_PREFIX }}
          OWNER: ${{ github.repository_owner }}
        run: |
          if [ -n "$PREFIX_VARIABLE" ]; then
            prefix="$PREFIX_VARIABLE"
          else
            # com.<owner>, lower case, only [a-z0-9.-]: Kevinparra535 -> com.kevinparra535
            prefix="com.$(printf '%s' "$OWNER" | tr '[:upper:]' '[:lower:]' | tr -cd 'a-z0-9.-')"
          fi
          if ! [[ "$prefix" =~ ^[A-Za-z0-9-]+(\.[A-Za-z0-9-]+)+$ ]]; then
            echo "::error title=Prefijo no válido / Invalid prefix::El prefijo «${prefix}» no es válido (ejemplo: com.tunombre). Corrige la variable BUNDLE_ID_PREFIX en Settings ▸ Secrets and variables ▸ Actions ▸ Variables y lanza una ejecución nueva: Actions ▸ TestFlight ▸ Run workflow.%0AThe prefix \"$prefix\" is not valid (example: com.yourname). Fix the BUNDLE_ID_PREFIX repository variable, then start a new run: Actions ▸ TestFlight ▸ Run workflow."
            exit 1
          fi
          echo "prefix=$prefix" >> "$GITHUB_OUTPUT"
          echo "Bundle id prefix: $prefix"

      - name: Check the API key with App Store Connect
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
        run: python3 tools/testflight/asc.py check-auth

      # Also removes the temporary certificates and profiles an earlier run left behind.
      - name: Register identifiers, find the app, remove leftovers of earlier runs
        id: prepare
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
          PREFIX: ${{ steps.prefix.outputs.prefix }}
          SETUP_ONLY: ${{ inputs.setup_only }}
        run: |
          if [ "$SETUP_ONLY" = true ]; then
            python3 tools/testflight/asc.py prepare --prefix "$PREFIX" --setup-only
          else
            python3 tools/testflight/asc.py prepare --prefix "$PREFIX"
          fi

      - name: Summary
        if: always()
        env:
          READY: ${{ steps.prepare.outputs.ready }}
          OUTCOME: ${{ steps.prepare.outcome }}
          SETUP_ONLY: ${{ inputs.setup_only }}
          APP_BUNDLE_ID: ${{ steps.prepare.outputs.app_bundle_id }}
          MARKETING_VERSION: ${{ steps.prepare.outputs.marketing_version }}
        run: |
          guide="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/blob/main/docs/TESTFLIGHT.md"
          {
            echo "## TestFlight — preparación / prepare"
            echo
            if [ "$READY" = true ]; then
              echo "Todo listo: ahora el trabajo «Build, sign and upload (macOS)» elige el número de build, compila y sube la versión **$MARKETING_VERSION** de \`$APP_BUNDLE_ID\` (unos 15–25 minutos)."
              echo
              echo "All set: next, the «Build, sign and upload (macOS)» job picks the build number, then builds and uploads version **$MARKETING_VERSION** of \`$APP_BUNDLE_ID\` (about 15–25 minutes)."
            elif [ "$SETUP_ONLY" = true ] && [ "$OUTCOME" = success ]; then
              echo "Modo «Solo preparar»: no se compila nada. Haz los pasos que faltan (arriba, si los hay) y después lanza una ejecución nueva **sin** marcar «Solo preparar»: **Actions ▸ TestFlight ▸ Run workflow** (*Re-run* repetiría «Solo preparar»)."
              echo
              echo "Setup-only mode: nothing is built. Do the remaining steps (above, if any), then start a new run **without** ticking «Solo preparar»: **Actions ▸ TestFlight ▸ Run workflow** (*Re-run* would repeat «Solo preparar»)."
            else
              echo "La preparación no terminó: lee los errores de arriba (guía: $guide). Cuando lo hayas corregido, lanza una ejecución nueva: **Actions ▸ TestFlight ▸ Run workflow**."
              echo
              echo "Preparation did not finish: read the errors above (guide: $guide). Once that is fixed, start a new run: **Actions ▸ TestFlight ▸ Run workflow**."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  build:
    name: Build, sign and upload (macOS)
    needs: prepare
    if: needs.prepare.outputs.ready == 'true'
    environment: testflight
    runs-on: macos-15
    timeout-minutes: 60
    outputs:
      # uploaded: the build reached Apple (uploaded, or committed and still processing).
      # teardown: the Clean up step ran to its end; if not, finish sweeps up after this job.
      uploaded: ${{ steps.teardown.outputs.uploaded }}
      teardown: ${{ steps.teardown.outputs.teardown }}
      # signing: the certificate step's outcome; skipped = the job stopped before it, so it made none.
      signing: ${{ steps.signing.outcome }}
      cert_id: ${{ steps.signing.outputs.cert_id }}
      profile_ids: ${{ steps.signing.outputs.profile_ids }}
      build_number: ${{ steps.buildnum.outputs.build_number }}
    # BUILD_NUMBER is not set here: the "Choose the build number" step puts it in GITHUB_ENV.
    env:
      BUNDLE_ID_PREFIX: ${{ needs.prepare.outputs.prefix }}
      APP_BUNDLE_ID: ${{ needs.prepare.outputs.app_bundle_id }}
      MIRROR_BUNDLE_ID: ${{ needs.prepare.outputs.mirror_bundle_id }}
      APP_BUNDLE_RESOURCE_ID: ${{ needs.prepare.outputs.app_bundle_resource_id }}
      MIRROR_BUNDLE_RESOURCE_ID: ${{ needs.prepare.outputs.mirror_bundle_resource_id }}
      APP_GROUP: ${{ needs.prepare.outputs.app_group }}
      APP_ID: ${{ needs.prepare.outputs.app_id }}
      MARKETING_VERSION: ${{ needs.prepare.outputs.marketing_version }}
      # Run by absolute path: Clean up recognizes a step a cancel left running by that path.
      BUILD_AND_SIGN: ${{ github.workspace }}/tools/testflight/build_and_sign.sh
      HOMEBREW_NO_AUTO_UPDATE: "1"
      HOMEBREW_NO_INSTALL_CLEANUP: "1"
      HOMEBREW_NO_ENV_HINTS: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # App Store Connect only accepts builds made with Xcode 26 / the iOS 26 SDK (since 2026-04-28).
      - name: Select the newest stable Xcode (26 or newer)
        run: |
          newest=$(find /Applications -maxdepth 1 -name 'Xcode_*.app' | grep -v -i -E 'beta|_rc|release_candidate' | sort -V | tail -n 1 || true)
          if [ -n "$newest" ]; then sudo xcode-select -s "$newest/Contents/Developer"; fi
          about=$(xcodebuild -version 2>&1 || true)
          version=$(printf '%s\n' "$about" | awk 'NR == 1 { print $2 }')
          echo "::notice title=Xcode::$(printf '%s' "$about" | tr '\n' ' ')"
          major=${version%%.*}
          case "$major" in '' | *[!0-9]*) major=0 ;; esac
          if [ "$major" -lt 26 ]; then
            echo "::error title=Xcode 26 necesario / Xcode 26 required::El runner solo tiene Xcode ${version:-?}; App Store Connect exige Xcode 26 o posterior. Cuando GitHub actualice la imagen macos-15, lanza una ejecución nueva: Actions ▸ TestFlight ▸ Run workflow.%0AThe runner only has Xcode ${version:-?}; App Store Connect requires Xcode 26 or newer. Once GitHub updates the macos-15 image, start a new run: Actions ▸ TestFlight ▸ Run workflow."
            exit 1
          fi

      - name: Install XcodeGen
        run: brew install xcodegen

      # Chosen here, not in prepare: every attempt of this job (a re-run too) gets a number Apple has
      # not seen yet.
      - name: Choose the build number
        id: buildnum
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
        run: |
          python3 tools/testflight/asc.py next-build --app-id "$APP_ID"
          number=$(sed -n 's/^build_number=//p' "$GITHUB_OUTPUT" | tail -n 1)
          if ! [[ "$number" =~ ^[0-9]+$ ]]; then
            echo "::error title=Número de build / Build number::asc.py next-build no dio un número de build («${number}»). Lanza una ejecución nueva: Actions ▸ TestFlight ▸ Run workflow.%0Aasc.py next-build gave no build number («${number}»). Start a new run: Actions ▸ TestFlight ▸ Run workflow."
            exit 1
          fi
          echo "BUILD_NUMBER=$number" >> "$GITHUB_ENV"

      - name: Create the temporary signing certificate and App Store profiles
        id: signing
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
        run: bash "$BUILD_AND_SIGN" create-signing

      - name: Temporary keychain with the signing identity
        run: bash "$BUILD_AND_SIGN" setup-keychain

      - name: Install the profiles; configure the project for manual signing
        run: |
          bash "$BUILD_AND_SIGN" install-profiles
          bash "$BUILD_AND_SIGN" configure

      - name: Archive (Release, iPhone) and lint the archive
        run: bash "$BUILD_AND_SIGN" archive

      - name: Export the IPA and lint it
        run: bash "$BUILD_AND_SIGN" export

      - name: Upload to App Store Connect
        id: upload
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
        run: bash "$BUILD_AND_SIGN" upload

      # Always: stops what a cancelled step left running, deletes keychain and key files. When no
      # build reached Apple it also revokes the temporary certificate and profiles right away
      # (otherwise the finish job does it). Outputs: uploaded=true|false, teardown=done.
      - name: Clean up
        id: teardown
        if: always()
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
        run: bash "$BUILD_AND_SIGN" teardown

      - name: Summary
        if: always()
        env:
          UPLOADED: ${{ steps.teardown.outputs.uploaded }}
          UPLOAD_OUTCOME: ${{ steps.upload.outcome }}
          METHOD: ${{ steps.upload.outputs.upload_method }}
          # skipped: the job stopped before the certificate step, so nothing was created to revoke.
          SIGNING_OUTCOME: ${{ steps.signing.outcome }}
          # cancelled: the run was cancelled (or the job hit its time limit): nothing to fix.
          JOB_STATUS: ${{ job.status }}
        run: |
          guide="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/blob/main/docs/TESTFLIGHT.md"
          version="$MARKETING_VERSION (${BUILD_NUMBER:-?})"
          revoke_es="" revoke_en=""
          if [ "$SIGNING_OUTCOME" != skipped ]; then
            revoke_es=" El paso «Clean up» revoca el certificado y los perfiles temporales (si no puede, deja un aviso con los pasos)."
            revoke_en=" The «Clean up» step revokes the temporary certificate and profiles (if it cannot, it leaves a warning with the steps)."
          fi
          {
            echo "## TestFlight — compilación / build"
            echo
            if [ "$UPLOADED" = true ] && [ "$UPLOAD_OUTCOME" = success ]; then
              echo "Subida la versión **$version** a App Store Connect (${METHOD:-rest}). Apple la procesa ahora; el trabajo «Processing, TestFlight group, revoke the certificate» espera, la añade a tu grupo interno de TestFlight y revoca el certificado temporal."
              echo
              echo "Uploaded version **$version** to App Store Connect (${METHOD:-rest}). Apple is processing it; the «Processing, TestFlight group, revoke the certificate» job waits, adds it to your internal TestFlight group and revokes the temporary certificate."
            elif [ "$UPLOADED" = true ]; then
              echo "Apple tiene (o puede tener) el archivo de la versión **$version**, pero el paso «Upload to App Store Connect» no terminó (se canceló o falló: mira las anotaciones). El trabajo «Processing, TestFlight group, revoke the certificate» espera a que Apple lo procese (si no cancelaste la ejecución) y después revoca el certificado temporal."
              echo
              echo "Apple has (or may have) the file of version **$version**, but the «Upload to App Store Connect» step did not finish (it was cancelled or failed: see the annotations). The «Processing, TestFlight group, revoke the certificate» job waits for Apple's processing (unless you cancelled the run), then revokes the temporary certificate."
            elif [ "$JOB_STATUS" = cancelled ]; then
              echo "Se canceló la ejecución (o el trabajo superó su tiempo máximo) y no se subió ninguna build.$revoke_es Cuando quieras, lanza una ejecución nueva: **Actions ▸ TestFlight ▸ Run workflow**."
              echo
              echo "The run was cancelled (or the job hit its time limit) and nothing was uploaded.$revoke_en Whenever you like, start a new run: **Actions ▸ TestFlight ▸ Run workflow**."
            else
              echo "No se subió ninguna build: lee las anotaciones de error de este trabajo (arriba).$revoke_es Cuando lo hayas corregido, lanza una ejecución nueva: **Actions ▸ TestFlight ▸ Run workflow** (*Re-run* repite el mismo commit, sin tus arreglos). Guía: $guide"
              echo
              echo "Nothing was uploaded: read this job's error annotations (above).$revoke_en Once that is fixed, start a new run: **Actions ▸ TestFlight ▸ Run workflow** (*Re-run* repeats the same commit, without your fixes). Guide: $guide"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  finish:
    name: Processing, TestFlight group, revoke the certificate
    needs: [prepare, build]
    # Whenever the build job ran, also after a failure, a cancel or a lost runner: the revoke step
    # makes sure no temporary certificate stays behind.
    if: always() && needs.prepare.outputs.ready == 'true' && needs.build.result != 'skipped'
    environment: testflight
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      APP_ID: ${{ needs.prepare.outputs.app_id }}
      BUILD_NUMBER: ${{ needs.build.outputs.build_number }}
      MARKETING_VERSION: ${{ needs.prepare.outputs.marketing_version }}
      UPLOADED: ${{ needs.build.outputs.uploaded }}
      TEARDOWN: ${{ needs.build.outputs.teardown }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Wait for Apple's processing; add the build to the internal group
        id: wait
        if: needs.build.outputs.uploaded == 'true'
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
        run: python3 tools/testflight/asc.py wait-build --app-id "$APP_ID" --build "$BUILD_NUMBER" --timeout-min 90

      # After a build reached Apple: only now, after processing, so Apple's processing never sees a
      # revoked certificate (builds already in TestFlight keep working after the revocation).
      # Without one, the build job's Clean up step revoked already, unless that job ended without
      # it (lost runner, force cancel): then this sweeps up the profiles this run left behind and
      # their certificate (janitor --run-id: this repository's run only).
      - name: Revoke the temporary certificate and profiles
        if: always()
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
          CERT_ID: ${{ needs.build.outputs.cert_id }}
          PROFILE_IDS: ${{ needs.build.outputs.profile_ids }}
          SIGNING: ${{ needs.build.outputs.signing }}
        run: |
          if [ ! -f tools/testflight/asc.py ]; then
            certs=https://developer.apple.com/account/resources/certificates/list
            profiles=https://developer.apple.com/account/resources/profiles/list
            # This run's profiles only («…»: the build job's attempt), never every «OpenCfMoto CI …».
            run="OpenCfMoto CI ${GITHUB_REPOSITORY_ID:+r$GITHUB_REPOSITORY_ID-}$GITHUB_RUN_ID-…"
            echo "::warning title=Revoca a mano / Revoke by hand::No se pudo revocar porque falló la descarga del código (checkout). En $certs revoca el certificado «Apple Distribution» creado hoy${CERT_ID:+ (id $CERT_ID)} (púlsalo ▸ Revoke) y en $profiles borra los perfiles «$run app» y «$run mirror»${PROFILE_IDS:+ (ids $PROFILE_IDS)} (cada uno ▸ Remove; ningún otro «OpenCfMoto CI …»). O lanza una ejecución nueva con «Solo preparar» marcado (Actions ▸ TestFlight ▸ Run workflow): su preparación borra estos restos.%0ACould not revoke because the code checkout failed. At $certs revoke the «Apple Distribution» certificate created today${CERT_ID:+ (id $CERT_ID)} (click it ▸ Revoke) and at $profiles delete the «$run app» and «$run mirror» profiles${PROFILE_IDS:+ (ids $PROFILE_IDS)} (each ▸ Remove; no other «OpenCfMoto CI …» one). Or start a new run with «Solo preparar» ticked (Actions ▸ TestFlight ▸ Run workflow): its prepare job removes these leftovers."
            exit 0
          fi
          if [ "$UPLOADED" = true ]; then
            args=()
            if [ -n "$CERT_ID" ]; then args+=(--cert-id "$CERT_ID"); fi
            if [ -n "$PROFILE_IDS" ]; then args+=(--profile-ids "$PROFILE_IDS"); fi
            if [ ${#args[@]} -gt 0 ]; then
              python3 tools/testflight/asc.py cleanup "${args[@]}"
            else
              echo "The build job passed on no certificate or profile ids: sweeping up what this run left behind."
              python3 tools/testflight/asc.py janitor --run-id "$GITHUB_RUN_ID"
            fi
          elif [ "$TEARDOWN" != "done" ]; then
            echo "The build job ended without its Clean up step (lost runner or a cancel): sweeping up what this run left behind."
            python3 tools/testflight/asc.py janitor --run-id "$GITHUB_RUN_ID"
          elif [ -n "$CERT_ID" ]; then
            echo "Nothing to revoke here: the build job's Clean up step already revoked the temporary certificate and profiles."
            echo "**Certificado / certificate:** ya lo revocó el paso «Clean up» del trabajo «Build, sign and upload (macOS)» (si no pudo, allí hay un aviso con los pasos). / The «Clean up» step of the «Build, sign and upload (macOS)» job already revoked it (if it could not, a warning there gives the steps)." >> "$GITHUB_STEP_SUMMARY"
          elif [ "$SIGNING" = skipped ]; then
            echo "Nothing to revoke here: the build job stopped before its certificate step."
            echo "**Certificado / certificate:** no hay nada que revocar: el trabajo «Build, sign and upload (macOS)» se detuvo antes de crear el certificado. / Nothing to revoke: the «Build, sign and upload (macOS)» job stopped before creating the certificate." >> "$GITHUB_STEP_SUMMARY"
          else
            # No certificate id although the certificate step ran: it made none, or Clean up revoked
            # it, or its id was lost (an unclear answer, a cancel during that step) and Clean up
            # looked for it by this run's key; when that failed, Clean up left a warning.
            echo "Nothing to revoke here: the build job recorded no certificate id (it made none, or its Clean up step revoked it; if Clean up left a warning, follow it)."
            echo "**Certificado / certificate:** el trabajo «Build, sign and upload (macOS)» no registró ningún certificado: o no llegó a crearlo, o su paso «Clean up» ya lo revocó. Si ese paso dejó un aviso («Certificado sin confirmar» o «Limpieza incompleta»), haz lo que dice. / The «Build, sign and upload (macOS)» job recorded no certificate: it made none, or its «Clean up» step already revoked it. If that step left a warning («Certificado sin confirmar» or «Limpieza incompleta»), do what it says." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Summary
        if: always()
        env:
          STATE: ${{ steps.wait.outputs.processing_state }}
          GROUP: ${{ steps.wait.outputs.beta_group }}
          OUTCOME: ${{ steps.wait.outcome }}
          BUILD_RESULT: ${{ needs.build.result }}
        run: |
          version="$MARKETING_VERSION (${BUILD_NUMBER:-?})"
          {
            echo "## TestFlight — resultado / result"
            echo
            if [ "$UPLOADED" != true ] && [ "$TEARDOWN" != "done" ] && [ "$BUILD_RESULT" = cancelled ]; then
              echo "La ejecución se canceló antes de que el trabajo «Build, sign and upload (macOS)» empezara o terminara su limpieza. El paso «Revoke the temporary certificate and profiles» de este trabajo borra lo que pudiera quedar (si no puede, deja un aviso con los pasos). Cuando quieras, lanza una ejecución nueva: **Actions ▸ TestFlight ▸ Run workflow**."
              echo
              echo "The run was cancelled before the «Build, sign and upload (macOS)» job started or finished its clean-up. This job's «Revoke the temporary certificate and profiles» step removes whatever may be left (if it cannot, a warning gives the steps). Whenever you like, start a new run: **Actions ▸ TestFlight ▸ Run workflow**."
            elif [ "$UPLOADED" != true ] && [ "$TEARDOWN" != "done" ]; then
              echo "El trabajo «Build, sign and upload (macOS)» terminó sin su paso «Clean up» (se perdió el runner o se forzó la cancelación), así que no se sabe si llegó a subir la build. El paso «Revoke the temporary certificate and profiles» de este trabajo borra los restos (si no puede, deja un aviso con los pasos). Lanza una ejecución nueva: **Actions ▸ TestFlight ▸ Run workflow**."
              echo
              echo "The «Build, sign and upload (macOS)» job ended without its «Clean up» step (lost runner or force cancel), so it is unknown whether the build was uploaded. This job's «Revoke the temporary certificate and profiles» step removes the leftovers (if it cannot, a warning gives the steps). Start a new run: **Actions ▸ TestFlight ▸ Run workflow**."
            elif [ "$UPLOADED" != true ] && [ "$BUILD_RESULT" = cancelled ]; then
              echo "La ejecución se canceló (o el trabajo «Build, sign and upload (macOS)» superó su tiempo máximo) y no se subió ninguna build. El paso «Clean up» de ese trabajo revocó lo que se llegó a crear (si no pudo, allí hay un aviso con los pasos). Cuando quieras, lanza una ejecución nueva: **Actions ▸ TestFlight ▸ Run workflow**."
              echo
              echo "The run was cancelled (or the «Build, sign and upload (macOS)» job hit its time limit) and no build was uploaded. That job's «Clean up» step revoked whatever had been created (if it could not, a warning there gives the steps). Whenever you like, start a new run: **Actions ▸ TestFlight ▸ Run workflow**."
            elif [ "$UPLOADED" != true ]; then
              echo "No hay build que esperar: el trabajo «Build, sign and upload (macOS)» no subió ninguna (mira sus anotaciones). Cuando lo hayas corregido, lanza una ejecución nueva: **Actions ▸ TestFlight ▸ Run workflow**."
              echo
              echo "No build to wait for: the «Build, sign and upload (macOS)» job uploaded none (see its annotations). Once that is fixed, start a new run: **Actions ▸ TestFlight ▸ Run workflow**."
            elif [ "$STATE" = VALID ]; then
              echo "La versión **$version** está lista en TestFlight (grupo interno: ${GROUP:-?}). Abre la app **TestFlight** en tu iPhone, con el Apple ID de tu cuenta de App Store Connect, e instala OpenCfMoto. Si no aparece, mira el correo de Apple y la guía docs/TESTFLIGHT.md."
              echo
              echo "Version **$version** is ready in TestFlight (internal group: ${GROUP:-?}). Open the **TestFlight** app on your iPhone, signed in with your App Store Connect Apple ID, and install OpenCfMoto. If it is not there, check Apple's e-mail and docs/TESTFLIGHT.md."
            elif [ "$STATE" = INVALID ] || [ "$STATE" = FAILED ]; then
              echo "Apple rechazó la versión **$version** (estado: $STATE): no aparecerá en TestFlight. Lee el error de arriba y el correo de App Store Connect (códigos ITMS), corrígelo y lanza una ejecución nueva: **Actions ▸ TestFlight ▸ Run workflow** (*Re-run* repite el mismo commit, sin tus arreglos)."
              echo
              echo "Apple rejected version **$version** (state: $STATE): it will not appear in TestFlight. Read the error above and App Store Connect's e-mail (ITMS codes), fix it and start a new run: **Actions ▸ TestFlight ▸ Run workflow** (*Re-run* repeats the same commit, without your fixes)."
            elif [ "$OUTCOME" = success ]; then
              echo "Apple todavía procesa la build ${STATE:+(estado: $STATE)}; aparecerá en la app TestFlight en cuanto termine (Apple suele avisar por correo)."
              echo
              echo "Apple is still processing the build ${STATE:+(state: $STATE)}; it shows up in the TestFlight app as soon as that ends (Apple usually e-mails you)."
            else
              if [ "$OUTCOME" = failure ]; then
                echo "No se pudo esperar a Apple: lee las anotaciones de error de este trabajo."
              else
                echo "No se esperó a Apple (la ejecución se canceló o falló un paso anterior de este trabajo)."
              fi
              echo "La versión **$version** ya está en App Store Connect: si Apple la acepta, aparecerá en la app TestFlight (Apple suele avisar por correo). Si no aparece, lanza una ejecución nueva: **Actions ▸ TestFlight ▸ Run workflow**."
              echo
              if [ "$OUTCOME" = failure ]; then
                echo "Could not wait for Apple: read this job's error annotations."
              else
                echo "Apple's processing was not waited for (the run was cancelled, or an earlier step of this job failed)."
              fi
              echo "Version **$version** is in App Store Connect already: if Apple accepts it, it shows up in the TestFlight app (Apple usually e-mails you). If it does not, start a new run: **Actions ▸ TestFlight ▸ Run workflow**."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
