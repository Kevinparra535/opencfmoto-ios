name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core-linux:
    name: Core tests (Linux)
    runs-on: ubuntu-latest
    container: swift:6.0
    steps:
      - uses: actions/checkout@v4
      - name: swift test (OpenCfMotoKit)
        shell: bash
        run: |
          set -o pipefail
          swift test --package-path Packages/OpenCfMotoKit 2>&1 | tee swift-test.log
      - name: Annotate errors
        if: failure()
        shell: bash
        run: |
          apt-get update -qq && apt-get install -y -qq python3 >/dev/null 2>&1 || true
          python3 tools/ci/annotate.py swift-test.log "Linux swift test"

  apple:
    name: Package tests (macOS) + iOS app build
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Show Xcode
        run: xcodebuild -version && swift --version
      - name: swift test (macOS — also compiles the Apple adapters)
        run: |
          set -o pipefail
          swift test --package-path Packages/OpenCfMotoKit 2>&1 | tee swift-test.log
      - name: Annotate package errors
        if: failure()
        run: python3 tools/ci/annotate.py swift-test.log "macOS swift test"
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate Xcode project
        run: xcodegen generate
      - name: Build iOS app (simulator, unsigned)
        run: |
          set -o pipefail
          xcodebuild \
            -project OpenCfMoto.xcodeproj \
            -scheme OpenCfMoto \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            build 2>&1 | tee build.log | grep -E "error:|warning: .*(deprecated|unused)|BUILD (SUCCEEDED|FAILED)" || true
          grep -q "BUILD SUCCEEDED" build.log
      - name: Annotate iOS build errors
        if: failure()
        run: python3 tools/ci/annotate.py build.log "iOS build"
      # What a rider installs from Xcode: the iPhone (arm64) slice, in Debug (Run) and Release
      # (Archive / a faster Run). Unsigned — signing needs the rider's own team — but it compiles
      # every device-only code path (`#if !targetEnvironment(simulator)`, non-DEBUG code).
      - name: Build iOS app (iPhone arm64, unsigned) — Debug and Release
        run: |
          set -o pipefail
          for config in Debug Release; do
            xcodebuild \
              -project OpenCfMoto.xcodeproj \
              -scheme OpenCfMoto \
              -configuration "$config" \
              -destination 'generic/platform=iOS' \
              CODE_SIGNING_ALLOWED=NO \
              build 2>&1 | tee "build-device-$config.log" | grep -E "error:|BUILD (SUCCEEDED|FAILED)" || true
            grep -q "BUILD SUCCEEDED" "build-device-$config.log"
          done
      - name: Annotate iPhone build errors
        if: failure()
        run: |
          for config in Debug Release; do
            if [ -f "build-device-$config.log" ]; then
              python3 tools/ci/annotate.py "build-device-$config.log" "iPhone build ($config)"
            fi
          done
      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-logs
          path: |
            build.log
            build-device-Debug.log
            build-device-Release.log
            swift-test.log
          if-no-files-found: ignore

  # Riders install with the newest Xcode (it is the one that supports the newest iOS on their iPhone),
  # not the runner's default: build the iPhone slice with the newest stable Xcode on the image too.
  iphone-newest-xcode:
    name: iPhone build (newest Xcode on the runner)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      # Every workflow file: syntax, expressions, contexts, job outputs (shellcheck off there: the
      # older jobs predate it). The TestFlight workflow and its script also go through shellcheck
      # (warnings and errors). Findings become annotations.
      - name: actionlint (workflow files)
        run: |
          set -uo pipefail
          if ! brew install actionlint shellcheck > brew-actionlint.log 2>&1; then
            echo "::error title=actionlint::brew install actionlint shellcheck failed: $(tail -n 5 brew-actionlint.log | tr '\n' ' ')"
            exit 1
          fi
          echo "actionlint $(actionlint -version | head -n 1), shellcheck $(shellcheck --version | sed -n 's/^version: //p')"
          fmt='{{range $err := .}}::error file={{$err.Filepath}},line={{$err.Line}},col={{$err.Column}},title=actionlint {{$err.Kind}}::{{$err.Message}}\n{{end}}'
          status=0
          actionlint -shellcheck= -pyflakes= -format "$fmt" .github/workflows/*.yml || status=1
          SHELLCHECK_OPTS="--severity=warning" actionlint -pyflakes= -format "$fmt" .github/workflows/testflight.yml || status=1
          if ! shellcheck --severity=warning --format=gcc tools/testflight/build_and_sign.sh > shellcheck.log 2>&1; then
            cat shellcheck.log
            sed -n -E 's/^([^:]+):([0-9]+):([0-9]+): [a-z]+: (.*)$/::error file=\1,line=\2,col=\3,title=shellcheck::\4/p' shellcheck.log | head -n 9
            status=1
          fi
          exit "$status"
      - name: Select the newest stable Xcode
        run: |
          installed=$(ls -d /Applications/Xcode*.app | xargs -n1 basename | tr '\n' ' ')
          newest=$(ls -d /Applications/Xcode_*.app | grep -v -i -E 'beta|_rc|release_candidate' | sort -V | tail -1)
          if [ -n "$newest" ]; then sudo xcode-select -s "$newest/Contents/Developer"; fi
          version=$(xcodebuild -version | tr '\n' ' ')
          echo "::notice title=Newest Xcode::$version selected (installed: $installed)"
          xcodebuild -showsdks | grep -i iphoneos || true
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate Xcode project
        run: xcodegen generate
      - name: Build iOS app (iPhone arm64, unsigned) — Debug and Release
        run: |
          set -o pipefail
          for config in Debug Release; do
            xcodebuild \
              -project OpenCfMoto.xcodeproj \
              -scheme OpenCfMoto \
              -configuration "$config" \
              -destination 'generic/platform=iOS' \
              CODE_SIGNING_ALLOWED=NO \
              build 2>&1 | tee "build-device-$config.log" | grep -E "error:|BUILD (SUCCEEDED|FAILED)" || true
            grep -q "BUILD SUCCEEDED" "build-device-$config.log"
          done
      - name: Annotate iPhone build errors
        if: failure()
        run: |
          for config in Debug Release; do
            if [ -f "build-device-$config.log" ]; then
              python3 tools/ci/annotate.py "build-device-$config.log" "iPhone build, newest Xcode ($config)"
            fi
          done
          grep -h -E "xcodebuild: error|is not installed|Unable to find a destination" build-device-*.log 2>/dev/null | head -5 | while read -r line; do echo "::error title=xcodebuild::$line"; done
      # TestFlight dry run (no secrets, nothing leaves the runner) for .github/workflows/testflight.yml:
      # the signing variables resolve as that workflow expects, an unsigned Release archive passes
      # tools/testflight/lint_bundle.py (privacy manifests, versions, extension layout...), and the
      # keychain plumbing of tools/testflight/build_and_sign.sh works with a throw-away identity.
      - name: TestFlight dry run — signing settings (developer defaults, then the CI Local.xcconfig)
        run: |
          set -euo pipefail
          rm -f Config/Local.xcconfig
          python3 tools/testflight/assert_build_settings.py --project OpenCfMoto.xcodeproj \
            --label "Signing, developer defaults (no Local.xcconfig)" \
            "OpenCfMoto:CODE_SIGN_STYLE=Automatic" "OpenCfMoto:CODE_SIGN_IDENTITY=Apple Development" \
            "OpenCfMoto:PROVISIONING_PROFILE_SPECIFIER=" "OpenCfMoto:PRODUCT_BUNDLE_IDENTIFIER=com.example.opencfmoto" \
            "OpenCfMotoMirror:CODE_SIGN_STYLE=Automatic" "OpenCfMotoMirror:CODE_SIGN_IDENTITY=Apple Development" \
            "OpenCfMotoMirror:PROVISIONING_PROFILE_SPECIFIER=" "OpenCfMotoMirror:PRODUCT_BUNDLE_IDENTIFIER=com.example.opencfmoto.mirror"
          # The Local.xcconfig the TestFlight build writes (build_and_sign.sh configure), fake team and profiles.
          d="$RUNNER_TEMP/tf-dry-run-settings"
          rm -rf "$d" && mkdir -p "$d"
          printf '%s\n' "S_TEAM_ID=ABCDE12345" "S_PROFILE_APP_NAME='CI dry run app'" "S_PROFILE_MIRROR_NAME='CI dry run mirror'" > "$d/state.env"
          TF_WORK="$d" BUNDLE_ID_PREFIX=com.cidryrun bash tools/testflight/build_and_sign.sh configure
          cat Config/Local.xcconfig
          python3 tools/testflight/assert_build_settings.py --project OpenCfMoto.xcodeproj \
            --label "Signing, TestFlight Local.xcconfig" \
            "OpenCfMoto:CODE_SIGN_STYLE=Manual" "OpenCfMoto:CODE_SIGN_IDENTITY=Apple Distribution" \
            "OpenCfMoto:PROVISIONING_PROFILE_SPECIFIER=CI dry run app" "OpenCfMoto:DEVELOPMENT_TEAM=ABCDE12345" \
            "OpenCfMoto:PRODUCT_BUNDLE_IDENTIFIER=com.cidryrun.opencfmoto" "OpenCfMoto:APP_GROUP_ID=group.com.cidryrun.opencfmoto" \
            "OpenCfMoto:CODE_SIGN_ENTITLEMENTS=App/Entitlements/full.entitlements" \
            "OpenCfMotoMirror:CODE_SIGN_STYLE=Manual" "OpenCfMotoMirror:CODE_SIGN_IDENTITY=Apple Distribution" \
            "OpenCfMotoMirror:PROVISIONING_PROFILE_SPECIFIER=CI dry run mirror" "OpenCfMotoMirror:DEVELOPMENT_TEAM=ABCDE12345" \
            "OpenCfMotoMirror:PRODUCT_BUNDLE_IDENTIFIER=com.cidryrun.opencfmoto.mirror"
          TF_WORK="$d" bash tools/testflight/build_and_sign.sh teardown
          if [ -e Config/Local.xcconfig ]; then echo "::error title=TestFlight dry run::teardown left Config/Local.xcconfig behind"; exit 1; fi
      - name: TestFlight dry run — unsigned Release archive + bundle lint
        run: |
          set -uo pipefail
          rm -f Config/Local.xcconfig
          archive="$RUNNER_TEMP/tf-dry-run/OpenCfMoto.xcarchive"
          rm -rf "$RUNNER_TEMP/tf-dry-run"
          xcodebuild -project OpenCfMoto.xcodeproj -scheme OpenCfMoto -configuration Release \
            -destination 'generic/platform=iOS' -archivePath "$archive" \
            CODE_SIGNING_ALLOWED=NO CURRENT_PROJECT_VERSION=1 archive > archive-dry-run.log 2>&1 || true
          grep -E "error:|\*\* ARCHIVE (SUCCEEDED|FAILED) \*\*" archive-dry-run.log || true
          if ! grep -q "ARCHIVE SUCCEEDED" archive-dry-run.log; then
            python3 tools/ci/annotate.py archive-dry-run.log "TestFlight dry run archive"
            exit 1
          fi
          python3 tools/testflight/lint_bundle.py --archive "$archive" --unsigned --expect-build 1 --min-sdk-major 26
      - name: TestFlight dry run — keychain plumbing (self-signed identity)
        run: |
          set -euo pipefail
          d="$RUNNER_TEMP/tf-keychain-dry-run"
          rm -rf "$d" && mkdir -p "$d/signing"
          # A throw-away self-signed code-signing identity named like a real distribution one.
          cat > "$d/openssl.cnf" << 'EOF'
          [req]
          distinguished_name = dn
          prompt = no
          [dn]
          CN = Apple Distribution: CI Dry Run (ABCDE12345)
          OU = ABCDE12345
          O = CI Dry Run
          C = US
          [codesign]
          basicConstraints = critical,CA:FALSE
          keyUsage = critical,digitalSignature
          extendedKeyUsage = critical,codeSigning
          EOF
          if ! /usr/bin/openssl req -x509 -new -newkey rsa:2048 -nodes -days 2 -config "$d/openssl.cnf" -extensions codesign \
               -keyout "$d/signing/key.pem" -out "$d/signing/cert.pem" > "$d/openssl.log" 2>&1; then
            echo "::error title=TestFlight dry run (keychain)::openssl req failed: $(tr '\n' ' ' < "$d/openssl.log")"
            exit 1
          fi
          /usr/bin/openssl x509 -in "$d/signing/cert.pem" -outform DER -out "$d/signing/cert.cer"
          export TF_WORK="$d" TF_SIGNING_DIR="$d/signing" TF_ALLOW_UNTRUSTED_IDENTITY=1
          bash tools/testflight/build_and_sign.sh setup-keychain
          kc="$d/testflight.keychain-db"
          fail() {
            echo "::error title=TestFlight dry run (keychain)::$1"
            bash tools/testflight/build_and_sign.sh teardown > /dev/null 2>&1 || true
            exit 1
          }
          # (Outputs go through variables: `cmd | grep -q` can fail on SIGPIPE under pipefail.)
          search=$(security list-keychains -d user)
          grep -q -F "$kc" <<< "$search" || fail "the temporary keychain is not in the user search list: $search"
          identities=$(security find-identity -p codesigning "$kc")
          sha=$(awk '/"Apple Distribution: CI Dry Run \(ABCDE12345\)"/ { print $2; exit }' <<< "$identities")
          if [ -z "$sha" ]; then fail "find-identity -p codesigning does not list the identity: $identities"; fi
          cp /usr/bin/true "$d/scratch"
          # set-key-partition-list must spare codesign the key-access dialog: a hang fails after 60 s.
          status=0
          perl -e 'alarm shift; exec @ARGV' 60 codesign --force --timestamp=none --sign "$sha" --keychain "$kc" "$d/scratch" > "$d/codesign.log" 2>&1 || status=$?
          if [ "$status" -eq 142 ]; then fail "codesign hung for 60 s (waiting for a key-access prompt?)"; fi
          if [ "$status" -ne 0 ]; then fail "codesign failed ($status): $(tr '\n' ' ' < "$d/codesign.log")"; fi
          codesign -dvv "$d/scratch" > "$d/verify.log" 2>&1 || true
          grep -q -F "Authority=Apple Distribution: CI Dry Run (ABCDE12345)" "$d/verify.log" \
            || fail "the scratch binary is not signed by the dry-run identity: $(tr '\n' ' ' < "$d/verify.log")"
          bash tools/testflight/build_and_sign.sh teardown
          if [ -e "$kc" ]; then fail "teardown left the keychain behind"; fi
          search=$(security list-keychains -d user)
          if grep -q -F "$kc" <<< "$search"; then fail "teardown left the keychain in the search list: $search"; fi
          if [ -e "$d/signing/key.pem" ]; then fail "teardown left the private key behind"; fi
          echo "::notice title=TestFlight dry run (keychain)::identity $sha imported; codesign signed without a prompt; teardown removed keychain, search-list entry and key"

  # The REAL app in the iOS Simulator: screenshots of every screen (demo services + demo content)
  # and end-to-end runs against tools/fakedash/fakedash.py on 127.0.0.1 (real sockets, link,
  # renderer, VideoToolbox encoder). Evidence is force-pushed to the orphan branch `ci-artifacts`
  # (RUN.md, PNGs, fakedash summaries, app logs) because job logs / artifacts are not always
  # reachable. Scripts: tools/ci/e2e/.
  e2e:
    name: E2E (iOS Simulator app <-> fake dash) + screenshots
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/wip/e2e'))
    runs-on: macos-15
    timeout-minutes: 60
    continue-on-error: true
    permissions:
      contents: write
    env:
      BUNDLE_ID: com.example.opencfmoto
      OUT: ${{ github.workspace }}/e2e-out
      HOMEBREW_NO_AUTO_UPDATE: "1"
      HOMEBREW_NO_INSTALL_CLEANUP: "1"
      HOMEBREW_NO_ENV_HINTS: "1"
    steps:
      - uses: actions/checkout@v4
      - name: Prepare (XcodeGen; ffmpeg + pngquant in the background; pick + boot an iPhone simulator)
        id: sim
        run: |
          mkdir -p "$OUT"
          t0=$(date +%s)
          brew install xcodegen
          nohup bash -c 'brew install ffmpeg pngquant > "$OUT/brew-ffmpeg.log" 2>&1; echo $? > "$OUT/brew-ffmpeg.rc"' < /dev/null > /dev/null 2>&1 &
          python3 tools/ci/e2e/simctl_pick.py > "$OUT/sim.txt"
          cat "$OUT/sim.txt" | tee -a "$GITHUB_OUTPUT"
          UDID=$(grep '^udid=' "$OUT/sim.txt" | cut -d= -f2)
          xcrun simctl boot "$UDID" || true
          {
            echo "sha=$GITHUB_SHA"
            echo "ref=$GITHUB_REF_NAME"
            echo "run_url=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            echo "date=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "xcode=$(xcodebuild -version | tr '\n' ' ')"
            echo "macos=$(sw_vers -productVersion)"
            echo "sim_name=$(grep '^name=' "$OUT/sim.txt" | cut -d= -f2-)"
            echo "sim_runtime=$(grep '^runtime=' "$OUT/sim.txt" | cut -d= -f2-)"
            echo "sim_udid=$UDID"
            echo "bundle=$BUNDLE_ID"
          } > "$OUT/env.txt"
          printf "prepare\t%s\tok\n" $(( $(date +%s) - t0 )) >> "$OUT/timings.tsv"
      - name: Build the app for the simulator (unsigned)
        id: build
        run: |
          t0=$(date +%s)
          xcodegen generate
          set -o pipefail
          xcodebuild -project OpenCfMoto.xcodeproj -scheme OpenCfMoto -configuration Debug \
            -destination "platform=iOS Simulator,id=${{ steps.sim.outputs.udid }}" \
            -derivedDataPath build/dd CODE_SIGNING_ALLOWED=NO COMPILER_INDEX_STORE_ENABLE=NO \
            build 2>&1 | tee "$OUT/build.log" | grep -E "error:|BUILD (SUCCEEDED|FAILED)" || true
          if grep -q "BUILD SUCCEEDED" "$OUT/build.log"; then st=ok; else st=failed; fi
          echo "status=$st" > "$OUT/build.env"
          printf "build\t%s\t%s\n" $(( $(date +%s) - t0 )) "$st" >> "$OUT/timings.tsv"
          [ "$st" = ok ]
      - name: Annotate build errors
        if: failure() && steps.build.outcome == 'failure'
        run: python3 tools/ci/annotate.py "$OUT/build.log" "e2e simulator build"
      - name: Install the app (clean status bar)
        id: install
        run: |
          t0=$(date +%s)
          UDID=${{ steps.sim.outputs.udid }}
          xcrun simctl bootstatus "$UDID" -b
          xcrun simctl install "$UDID" build/dd/Build/Products/Debug-iphonesimulator/OpenCfMoto.app
          xcrun simctl status_bar "$UDID" override --time "9:41" --dataNetwork wifi --wifiMode active --wifiBars 3 \
            --cellularMode active --cellularBars 4 --batteryState charged --batteryLevel 100 || true
          xcrun simctl privacy "$UDID" grant camera "$BUNDLE_ID" || true
          printf "install\t%s\tok\n" $(( $(date +%s) - t0 )) >> "$OUT/timings.tsv"
      - name: Screenshots (demo services + demo content)
        if: steps.install.outcome == 'success'
        run: |
          t0=$(date +%s)
          bash tools/ci/e2e/screenshots.sh "${{ steps.sim.outputs.udid }}" "$BUNDLE_ID" "$OUT"
          printf "screenshots\t%s\tok\n" $(( $(date +%s) - t0 )) >> "$OUT/timings.tsv"
      - name: Wait for ffmpeg
        if: steps.install.outcome == 'success'
        run: |
          t0=$(date +%s)
          for i in $(seq 1 120); do [ -f "$OUT/brew-ffmpeg.rc" ] && break; sleep 5; done
          rc=$(cat "$OUT/brew-ffmpeg.rc" 2>/dev/null || echo timeout)
          echo "brew install ffmpeg: $rc"
          tail -n 5 "$OUT/brew-ffmpeg.log" || true
          if command -v ffmpeg > /dev/null; then ffmpeg -version | head -1; else echo "::warning title=ffmpeg::not available, frames will not be decoded"; fi
          printf "ffmpeg\t%s\t%s\n" $(( $(date +%s) - t0 )) "$rc" >> "$OUT/timings.tsv"
      - name: E2E cfdl16 (800x386 landscape, non-touch)
        if: steps.install.outcome == 'success'
        run: |
          t0=$(date +%s)
          bash tools/ci/e2e/run-fakedash.sh "${{ steps.sim.outputs.udid }}" "$BUNDLE_ID" cfdl16 cfdl16 45 "$OUT"
          printf "e2e cfdl16\t%s\tdone\n" $(( $(date +%s) - t0 )) >> "$OUT/timings.tsv"
      - name: E2E cfdl26 (800x951 portrait, notify burst) with the dash view open
        if: steps.install.outcome == 'success'
        run: |
          t0=$(date +%s)
          bash tools/ci/e2e/run-fakedash.sh "${{ steps.sim.outputs.udid }}" "$BUNDLE_ID" cfdl26 cfdl26 30 "$OUT" -uiScreen dash
          printf "e2e cfdl26\t%s\tdone\n" $(( $(date +%s) - t0 )) >> "$OUT/timings.tsv"
      - name: E2E reconnect (the dash drops every socket, twice)
        if: steps.install.outcome == 'success'
        run: |
          t0=$(date +%s)
          FAKEDASH_ARGS="--cycles 2" bash tools/ci/e2e/run-fakedash.sh "${{ steps.sim.outputs.udid }}" "$BUNDLE_ID" reconnect cfdl16 10 "$OUT"
          printf "e2e reconnect\t%s\tdone\n" $(( $(date +%s) - t0 )) >> "$OUT/timings.tsv"
      - name: E2E stall (the dash stops pulling for 12 s; phone watchdog)
        if: steps.install.outcome == 'success'
        run: |
          t0=$(date +%s)
          FAKEDASH_ARGS="--stall-seconds 12" bash tools/ci/e2e/run-fakedash.sh "${{ steps.sim.outputs.udid }}" "$BUNDLE_ID" stall cfdl16 6 "$OUT"
          printf "e2e stall\t%s\tdone\n" $(( $(date +%s) - t0 )) >> "$OUT/timings.tsv"
      - name: E2E touch (800MT 1280x576 touch dash, injected taps / drags / pinch)
        if: steps.install.outcome == 'success'
        run: |
          t0=$(date +%s)
          bash tools/ci/e2e/run-fakedash.sh "${{ steps.sim.outputs.udid }}" "$BUNDLE_ID" touch mt800 15 "$OUT" -uiScreen dash
          printf "e2e touch\t%s\tdone\n" $(( $(date +%s) - t0 )) >> "$OUT/timings.tsv"
      - name: Report (RUN.md + annotations; fails when a required scenario failed)
        if: always()
        run: |
          mkdir -p "$OUT/crash"
          cp ~/Library/Logs/DiagnosticReports/OpenCfMoto*.ips "$OUT/crash/" 2>/dev/null || true
          python3 tools/ci/e2e/assemble.py "$OUT" "$RUNNER_TEMP/ci-artifacts" --strict --require=cfdl16,cfdl26
      - name: Publish to the ci-artifacts branch
        if: always()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash tools/ci/e2e/publish.sh "$RUNNER_TEMP/ci-artifacts"
