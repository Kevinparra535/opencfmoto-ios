name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core-linux:
    name: Core tests (Linux)
    runs-on: ubuntu-latest
    container: swift:6.0
    steps:
      - uses: actions/checkout@v4
      - name: swift test (OpenCfMotoKit)
        run: |
          set -o pipefail
          swift test --package-path Packages/OpenCfMotoKit 2>&1 | tee swift-test.log
      - name: Annotate errors
        if: failure()
        run: |
          apt-get update -qq && apt-get install -y -qq python3 >/dev/null 2>&1 || true
          python3 tools/ci/annotate.py swift-test.log "Linux swift test"

  apple:
    name: Package tests (macOS) + iOS app build
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Show Xcode
        run: xcodebuild -version && swift --version
      - name: swift test (macOS — also compiles the Apple adapters)
        run: |
          set -o pipefail
          swift test --package-path Packages/OpenCfMotoKit 2>&1 | tee swift-test.log
      - name: Annotate package errors
        if: failure()
        run: python3 tools/ci/annotate.py swift-test.log "macOS swift test"
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate Xcode project
        run: xcodegen generate
      - name: Build iOS app (simulator, unsigned)
        run: |
          set -o pipefail
          xcodebuild \
            -project OpenCfMoto.xcodeproj \
            -scheme OpenCfMoto \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            build 2>&1 | tee build.log | grep -E "error:|warning: .*(deprecated|unused)|BUILD (SUCCEEDED|FAILED)" || true
          grep -q "BUILD SUCCEEDED" build.log
      - name: Annotate iOS build errors
        if: failure()
        run: python3 tools/ci/annotate.py build.log "iOS build"
      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-logs
          path: |
            build.log
            swift-test.log
          if-no-files-found: ignore
