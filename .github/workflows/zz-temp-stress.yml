# TEMPORARY (dropped before the fix is final): evidence for the unlock race of
# VideoEngineBackgroundTests. "old" = the test file of 0a5af9b, "new" = this branch.
# OCM_WIDEN_SWITCH_MS makes the engine sleep inside its switch windows (temporary hook).
name: TEMP video engine stress

on:
  push:
    branches: [claude/zealous-ride-b80dtc]

permissions:
  contents: read

concurrency:
  group: temp-stress-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  stress:
    name: ${{ matrix.name }}
    runs-on: macos-15
    timeout-minutes: 70
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: "old tests, switch windows widened 500 ms"
            tests: old
            widen: "500"
            load: "0"
            filter1: "VideoEngineBackgroundTests/"
            count1: "1"
            filter2: ""
            count2: "0"
          - name: "new tests, switch windows widened 500 ms"
            tests: new
            widen: "500"
            load: "0"
            filter1: "VideoEngineBackgroundTests/"
            count1: "2"
            filter2: ""
            count2: "0"
          - name: "old target test, CPU load"
            tests: old
            widen: "0"
            load: "1"
            filter1: "VideoEngineBackgroundTests/testEncoderTagChangesOnlyAtIDRsAcrossLockAndUnlock"
            count1: "150"
            filter2: ""
            count2: "0"
          - name: "new tests, CPU load"
            tests: new
            widen: "0"
            load: "1"
            filter1: "VideoEngineBackgroundTests/testEncoderTagChangesOnlyAtIDRsAcrossLockAndUnlock"
            count1: "150"
            filter2: "VideoEngineBackgroundTests/(testStatusLineWithABackgroundEncoderAndItsCounters|testThreeEncodeFailuresDemoteToHold|testARetryCanBringTheBackgroundEncoderBack|testLadderTriesThePreWarmed|testEveryRungRejectedEndsInHold|testHoldReasonsPolicyAndNoEncoderRung|testWrongSizeSPS|testCPUFactoryAddsTheSecondRung)"
            count2: "15"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Old test file (0a5af9b)
        if: matrix.tests == 'old'
        run: git checkout 0a5af9b -- Packages/OpenCfMotoKit/Tests/OpenCfMotoAppleTests/VideoEngineBackgroundTests.swift
      - name: Build the tests
        run: |
          xcodebuild -version && sysctl -n hw.ncpu
          swift build --build-tests --package-path Packages/OpenCfMotoKit 2>&1 | tail -n 5
      - name: Run
        env:
          OCM_WIDEN_SWITCH_MS: ${{ matrix.widen }}
          LOAD: ${{ matrix.load }}
          FILTER1: ${{ matrix.filter1 }}
          COUNT1: ${{ matrix.count1 }}
          FILTER2: ${{ matrix.filter2 }}
          COUNT2: ${{ matrix.count2 }}
          JOB_NAME: ${{ matrix.name }}
        run: |
          set +e
          cd Packages/OpenCfMotoKit
          pids=()
          trap 'kill "${pids[@]}" 2>/dev/null' EXIT
          if [ "$LOAD" = "1" ]; then
            for _ in $(seq "$(sysctl -n hw.ncpu)"); do (while :; do :; done) & pids+=($!); done
            echo "CPU load: ${#pids[@]} busy loops"
          fi
          fails=0
          total=0
          run() {
            local filter=$1 count=$2 i start
            [ -n "$filter" ] && [ "$count" -gt 0 ] || return 0
            start=$SECONDS
            for i in $(seq "$count"); do
              total=$((total + 1))
              if ! swift test --skip-build --filter "$filter" > run.log 2>&1; then
                fails=$((fails + 1))
                echo "::group::FAILED run $i of $filter"
                grep -E ": error: |' failed \(|Executed [0-9]+ tests?" run.log | head -n 60
                echo "::endgroup::"
              fi
            done
            echo "$filter: $count runs in $((SECONDS - start)) s"
            grep -E "Executed [0-9]+ tests?" run.log | tail -n 1
          }
          run "$FILTER1" "$COUNT1"
          run "$FILTER2" "$COUNT2"
          echo "RESULT: $fails failing runs of $total"
          echo "### $JOB_NAME: $fails failing runs of $total" >> "$GITHUB_STEP_SUMMARY"
          [ "$fails" -eq 0 ]
